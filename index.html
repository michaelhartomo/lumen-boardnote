    <script>
      // Runtime error filtering: Vite client HMR WebSocket errors
      (function() {
        function isIgnorableNoise(err, msg, file) {
          const str = (err && (err.message || err.stack)) || msg || '';
          const filename = file || (err && err.filename) || '';
          return (
            str.includes('WebSocket') ||
            str.includes('vite') ||
            str.includes('createWebSocketModuleRunnerTransport') ||
            filename.includes('@vite/client')
          );
        }

        // Filter console.error and console.warn for known Vite client dev server notices
        if (typeof console !== 'undefined' && console.error) {
          const origConsoleError = console.error.bind(console);
          console.error = function() {
            const msg = Array.prototype.slice.call(arguments).map(function(a) {
              return (typeof a === 'string' ? a : (a && a.message) || '');
            }).join(' ');
            if (isIgnorableNoise(null, msg, '')) {
              return;
            }
            origConsoleError.apply(console, arguments);
          };
        }

        if (typeof console !== 'undefined' && console.warn) {
          const origConsoleWarn = console.warn.bind(console);
          console.warn = function() {
            const msg = Array.prototype.slice.call(arguments).map(function(a) {
              return (typeof a === 'string' ? a : (a && a.message) || '');
            }).join(' ');
            if (isIgnorableNoise(null, msg, '')) {
              return;
            }
            origConsoleWarn.apply(console, arguments);
          };
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isIgnorableNoise(event.reason, '', '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isIgnorableNoise(event.error, event.message, event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        const origOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (isIgnorableNoise(error, msg, url)) {
            return true; // suppresses the error
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
          return false;
        };
      })();
    </script>

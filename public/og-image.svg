<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-blue" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="85%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-amber" cx="70%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="card-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-card" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.25" fill="#334155" fill-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Subtle Radial Glow Overlays -->
  <rect width="1200" height="630" fill="url(#glow-blue)" />
  <rect width="1200" height="630" fill="url(#glow-purple)" />
  <rect width="1200" height="630" fill="url(#glow-amber)" />

  <!-- Spatial Canvas Grid -->
  <rect width="1200" height="630" fill="url(#grid-pattern)" />

  <!-- Subtle Connection Lines -->
  <path d="M 520 280 C 620 280, 680 210, 760 210" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 6" />
  <path d="M 520 370 C 640 370, 700 460, 780 460" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="6 6" />

  <!-- Left Column: Branding, Title & Description -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <g>
      <rect x="0" y="0" width="168" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow-badge)" />
      <circle cx="16" cy="16" r="4.5" fill="#10b981" />
      <text x="30" y="21" fill="#93c5fd" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">VISUAL WORKSPACE</text>
    </g>

    <!-- Brand Header -->
    <text x="0" y="96" fill="#ffffff" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">
      Lumen Notes
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="146" fill="#cbd5e1" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="22" font-weight="500">
      Visual Spatial Canvas &amp; Moodboard Studio
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="200" fill="#94a3b8" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="15" font-weight="400" width="480">
      <tspan x="0" dy="0">Organize thoughts, research bookmarks, multimedia,</tspan>
      <tspan x="0" dy="24">spreadsheets, docs, and sketches on an infinite</tspan>
      <tspan x="0" dy="24">spatial grid with real-time sync and visual previews.</tspan>
    </text>

    <!-- Feature Tags Strip -->
    <g transform="translate(0, 310)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="108" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="18" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">24px Grid</text>

      <!-- Tag 2 -->
      <rect x="120" y="0" width="124" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="134" y="18" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Weblink Cards</text>

      <!-- Tag 3 -->
      <rect x="256" y="0" width="112" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="270" y="18" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Rich Media</text>

      <!-- Tag 4 -->
      <rect x="380" y="0" width="108" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="394" y="18" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Sync Boards</text>
    </g>
  </g>

  <!-- Right Side: Decorative Floating Mockup Cards (16:9 / 1200x630 Layout) -->
  <g transform="translate(680, 80)">
    <!-- Back Card (Drawing / Canvas) -->
    <g transform="translate(80, 30) rotate(5)" filter="url(#shadow-card)">
      <rect width="360" height="220" rx="12" fill="url(#card-grad-2)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4" />
      <!-- Card Header -->
      <rect width="360" height="38" rx="12" fill="#1e1b4b" fill-opacity="0.8" />
      <circle cx="24" cy="19" r="4" fill="#ec4899" />
      <circle cx="38" cy="19" r="4" fill="#a855f7" />
      <circle cx="52" cy="19" r="4" fill="#3b82f6" />
      <text x="70" y="23" fill="#e9d5ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Spatial Architecture Sketch</text>
      <!-- Sketch Graphic -->
      <path d="M 40 140 Q 110 70, 180 130 T 320 100" fill="none" stroke="#c084fc" stroke-width="3" />
      <path d="M 60 170 Q 140 120, 220 170 T 310 140" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.7" />
    </g>

    <!-- Middle Card (Weblink Card with 16:9 OpenGraph Image Render & Web Status) -->
    <g transform="translate(10, 150) rotate(-3)" filter="url(#shadow-card)">
      <rect width="380" height="250" rx="12" fill="url(#card-grad-1)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6" />
      <!-- Header with Status -->
      <rect width="380" height="42" rx="12" fill="#0f172a" fill-opacity="0.9" />
      <circle cx="26" cy="21" r="5" fill="#3b82f6" />
      <text x="40" y="25" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Design Systems Repository</text>
      <!-- Status Badge -->
      <rect x="296" y="11" width="68" height="20" rx="4" fill="#065f46" fill-opacity="0.6" stroke="#10b981" stroke-width="1" />
      <circle cx="308" cy="21" r="3" fill="#10b981" />
      <text x="318" y="25" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">200 OK</text>

      <!-- Embedded Image Render Banner (16:9 preview) -->
      <g transform="translate(14, 52)">
        <rect width="352" height="116" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <!-- Abstract Render Artwork inside Banner -->
        <rect width="352" height="116" rx="8" fill="url(#card-grad-3)" />
        <circle cx="280" cy="58" r="42" fill="#3b82f6" fill-opacity="0.4" />
        <circle cx="100" cy="70" r="30" fill="#6366f1" fill-opacity="0.5" />
        <path d="M 0 90 Q 90 40, 180 80 T 352 60 L 352 116 L 0 116 Z" fill="#1e3a8a" fill-opacity="0.5" />
        <!-- Overlay Badge -->
        <rect x="254" y="8" width="90" height="22" rx="4" fill="#0f172a" fill-opacity="0.8" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.3" />
        <text x="264" y="23" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700">Open Image</text>
      </g>

      <!-- URL Row -->
      <g transform="translate(14, 180)">
        <text x="0" y="12" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Curated design systems &amp; UI token patterns</text>
        <rect x="0" y="22" width="352" height="32" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1" />
        <text x="12" y="42" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">https://designsystemsrepo.com</text>
      </g>
    </g>

    <!-- Front Accent Badge (Note / Principle) -->
    <g transform="translate(160, 410) rotate(2)" filter="url(#shadow-card)">
      <rect width="250" height="88" rx="10" fill="#fef08a" stroke="#eab308" stroke-width="1.2" />
      <text x="16" y="26" fill="#713f12" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">Spatial Math: 24px Grid</text>
      <text x="16" y="46" fill="#854d0e" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500">Every card, margin, and gap</text>
      <text x="16" y="62" fill="#854d0e" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500">aligns dynamically on board.</text>
    </g>
  </g>
</svg>
